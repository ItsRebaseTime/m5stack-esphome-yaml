# M5Stack Tough (SKU: K034) — AXP192 PMU Configuration Example
#
# AXP192 power rail assignments for the Tough:
#   DCDC1  3350 mV  — ESP32 core power (set by firmware, do not change)
#   DCDC3  2100-3500 mV — LCD backlight (PWM-dimmed via FloatOutput)
#   DLDO2  3300 mV  — Peripheral bus power (SD card, RS-485, etc.)
#   DLDO3  3000 mV  — Touch panel + display logic power
#
# Key differences from Core2:
#   - No vibration motor (DLDO3 powers touch/display instead)
#   - DLDO2 at 3300 mV (vs 3000 mV on Core2)
#   - No TS pin / battery thermistor (disabled in AXP192 setup)

substitutions:
  friendly_name: "M5Stack Tough"
  esphome_name: "m5stack-tough"
  sensor_update: "60s"

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-core2
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: quad
  speed: 80MHz

api:

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

logger:

# Internal I²C bus: AXP192 PMU + FT6336U touch controller
i2c:
  id: bus_internal
  sda: GPIO21
  scl: GPIO22
  scan: true

# SPI bus: ILI9342C display
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO38

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp192]
    refresh: 0s

# ── AXP192 PMU ─────────────────────────────────────────────────────────────

axp192:
  id: axp192_pmu
  i2c_id: bus_internal

# ── Sensors ────────────────────────────────────────────────────────────────

sensor:
  - platform: axp192
    id: axp192_sensor
    update_interval: ${sensor_update}

    # Battery calibration for Tough 390 mAh Li-Po.
    # Adjust voltage thresholds by logging battery_voltage while discharging
    # fully, then charging fully, to find your device's actual min/max.
    battery_discharge_100pc_voltage: 3670  # mV — full charge resting voltage
    battery_discharge_0pc_voltage: 3000    # mV — cutoff voltage
    battery_charge_100pc_current: 60       # mA — trickle current at full charge
    battery_charge_0pc_current: 420        # mA — bulk current at empty

    battery_level:
      name: "Battery Level"
    battery_voltage:
      name: "Battery Voltage"
    battery_power:
      name: "Battery Power"
    battery_charge_current:
      name: "Battery Charge Current"
    battery_discharge_current:
      name: "Battery Discharge Current"

    # ACIN = 5 V DC barrel-jack input (separate pin from USB/VBUS on AXP192)
    usb_voltage:
      name: "ACIN Voltage"
    usb_current:
      name: "ACIN Current"

    # VBUS = USB-C / Micro-USB input
    vbus_voltage:
      name: "VBus Voltage"
    vbus_current:
      name: "VBus Current"

    aps_voltage:
      name: "APS Voltage"
    internal_temperature:
      name: "AXP192 Temperature"

    # Binary sensors
    battery_charging:
      name: "Battery Charging"
    battery_connected:
      name: "Battery Connected"
    battery_discharging:
      name: "Battery Discharging"
    battery_in_active_mode:
      name: "Battery Active Mode"
    low_charge_current:
      name: "Low Charge Current"
    usb_present:
      name: "ACIN Present"
    usb_valid:
      name: "ACIN Valid"
    vbus_present:
      name: "VBus Present"
    vbus_valid:
      name: "VBus Valid"
    over_temperature:
      name: "Over Temperature"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: ${sensor_update}
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"

# ── Power Outputs ───────────────────────────────────────────────────────────

output:
  # LCD backlight brightness control (FloatOutput, 0.0 = off, 1.0 = full)
  - platform: axp192
    type: range
    channel: DCDC3
    id: lcd_backlight_output
    min_voltage: 2100
    max_voltage: 3500

  # Peripheral bus power — SD card, RS-485, hat connectors
  - platform: axp192
    type: switch
    channel: DLDO2
    id: peripheral_power_output
    voltage: 3300

  # Touch panel + display logic power
  # Note: no vibration motor on Tough; DLDO3 drives touch/display here
  - platform: axp192
    type: switch
    channel: DLDO3
    id: touch_display_power_output
    voltage: 3000

# ── Lights ─────────────────────────────────────────────────────────────────

light:
  - platform: monochromatic
    id: display_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    entity_category: config
    output: lcd_backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: binary
    name: "Peripheral Power"
    output: peripheral_power_output
    restore_mode: ALWAYS_ON

  - platform: binary
    name: "Touch/Display Power"
    output: touch_display_power_output
    restore_mode: ALWAYS_ON

# ── Switches ───────────────────────────────────────────────────────────────

switch:
  # Green charging-status LED (AXP192 GPIO1 / CHGLED pin)
  - platform: axp192
    led_pwr:
      name: "Charging LED"

# ── Touchscreen ────────────────────────────────────────────────────────────

touchscreen:
  - platform: ft63x6
    id: touch
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

# Touch-area buttons matching the three circles printed on the Tough bezel
binary_sensor:
  - platform: touchscreen
    name: "Button A"
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true

  - platform: touchscreen
    name: "Button B"
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true

  - platform: touchscreen
    name: "Button C"
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true

# ── Display ────────────────────────────────────────────────────────────────

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin:
      number: GPIO15
      ignore_strapping_warning: true
    cs_pin:
      number: GPIO5
      ignore_strapping_warning: true
    data_rate: 40MHz
    invert_colors: true
    id: m5tough_display
    show_test_card: true

# ── Diagnostics ────────────────────────────────────────────────────────────

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
  - platform: version
    name: "Firmware Version"
    entity_category: diagnostic
